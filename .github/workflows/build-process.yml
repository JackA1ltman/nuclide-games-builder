name: Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      game_repo:
        required: true
        type: string
      game_name:
        required: true
        type: string
      game_branch:
        required: false
        type: string
      game_base:
        required: false
        type: string

jobs:
  build-nuclide-sdk-games:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install necessary packages
        run: |
          # Install standard packages
          # sudo apt update
          # sudo apt install git make gcc pkg-config -y

          # Install Libs
          # sudo apt install libpng-dev mesa-common-dev libvulkan-dev  libxtst-dev libxss-dev libxrandr-dev libxcursor-dev libasound2-dev libatopology-dev libjpeg-dev libspeex-dev libspeexdsp-dev libopus-dev libvorbis-dev libsdl2-dev autoconf automake libtool libavformat-dev libswscale-dev -y

      - name: Git Nuclide SDK and Build FTEQCC
        run: |
          # Get Nuclide SDK (eukara edition)
          git clone https://code.idtech.space/eukara/nuclide.git nuclide
          cd nuclide
          ## Pull latest
          make update

          # Build FTEQCC
          make fteqcc

      - name: Git Games from repo
        run: |
          cd nuclide

          # Get Games
          if [[ "${{ inputs.game_name }}" == "valve" ]]; then
            git clone https://code.idtech.space/"${{ inputs.game_repo }}".git "${{ inputs.game_name }}"
          elif [[ "${{ inputs.game_name }}" == "hl2" ]]; then
            git clone https://code.idtech.space/fn/valve.git valve
            git clone https://code.idtech.space/"${{ inputs.game_repo }}".git "${{ inputs.game_name }}"
          else
            if [[ "${{ inputs.game_base }}" == "hl2" ]]; then
                git clone https://code.idtech.space/fn/valve.git valve
                git clone https://code.idtech.space/fn/hl2.git hl2
            else
                git clone https://code.idtech.space/fn/valve.git valve
            fi

            if [[ "${{ inputs.game_name }}" == "css" ]]; then
                git clone https://code.idtech.space/fn/cstrike.git cstrike
            fi

            if [[ -f "${{ inputs.game_branch }}" ]]; then
                git clone https://code.idtech.space/"${{ inputs.game_repo }}".git -b "${{ inputs.game_branch }}" "${{ inputs.game_name }}"
            else
                git clone https://code.idtech.space/"${{ inputs.game_repo }}".git "${{ inputs.game_name }}"
            fi
          fi

      - name: Build Games
        run: |
          cd nuclide
          export PATH=$PATH:$GITHUB_WORKSPACE/nuclide/


          # Build and Pack it to .pk*
          make dist-pak NAME=bin GAME="${{ inputs.game_name }}"

      - name: Detect additional valve pk4
        run: |
          cd nuclide/build/bin-content/${{ inputs.game_name }}/

          if [[ "${{ inputs.game_name }}" == "valve" ]] || [[ "${{ inputs.game_name }}" == "hl2" ]]; then
            rm -f package_valve.pk4
            rm -f package_hl2.pk4
            echo "Removed repeated game pk4 file."
          fi

          if [[ "${{ inputs.game_name }}" == "css" ]]; then
            rm -f package_cstrike
            echo "Removed repeated game pk4 file."
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ inputs.game_name }}
          path: |
            nuclide/build/bin-content/${{ inputs.game_name }}/*.pk*
