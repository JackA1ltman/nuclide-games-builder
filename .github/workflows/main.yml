name: Build Nuclide SDK Engine(FTEQW)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build-valve:
        description: 'Build Half-Life ?'
        required: true
        type: boolean
        default: true
      build-hl2:
        description: 'Build Half-Life 2 ?'
        required: true
        type: boolean
        default: false
      build-tfc:
        description: 'Build Team Fortress ?'
        required: true
        type: boolean
        default: false
      build-rewolf:
        description: 'Build Gunslinger Saga ?'
        required: true
        type: boolean
        default: false

jobs:
  build-valve:
    uses: ./.github/workflows/build-valve.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: ${{ inputs.build-valve }}

  build-hl2:
    uses: ./.github/workflows/build-hl2.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: ${{ inputs.build-hl2 }}

  build-tfc:
    uses: ./.github/workflows/build-tfc.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: ${{ inputs.build-tfc }}

  build-rewolf:
    uses: ./.github/workflows/build-rewolf.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: ${{ inputs.build-rewolf }}

  release:
    runs-on: ubuntu-latest
    needs:
      - build-valve
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Nuclide SDK Engine"
      RELEASE_BODY:
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and Create New Tag
        run: |
            LATEST_TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name')
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1-r0"
            fi

            NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

            echo "New tag: $NEW_TAG"
            echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

            git tag $NEW_TAG
            git push origin $NEW_TAG

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Set release body
        run: |
          cat << 'EOF' > release_body.md

          testing release
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: ""
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md

      - name: Upload Release Assets
        run: |
          for file in ./downloaded-artifacts/game-*/*; do
            if [ -d "$file" ]; then
              continue
            fi
            echo "Uploading $file..."
            gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*

